
# possible values: OFF,FATAL,ERROR,WARN,INFO,DEBUG,TRACE,ALL
logLevel=INFO

# reload plugin settings when settings.properties changes
reloadOnChange=true

# send plugin welcome message to player on login
enableWelcomeMessage=false

threat.threshold=10000
# Minutes between spawn checks once a sector reached the threshold.
threat.checkIntervalMinutes=5
threat.npcKill=50
# Generic terrain actions do not add threat; tool-specific values below do.
threat.terrainHit=0
# Pickaxes and the mining drill use this value.
threat.pickaxe=2
threat.hoe=1
threat.sledgehammer=1
# Felling trees; mining large rocks uses threat.pickaxe.
threat.vegetation=2
# Destroying a placed world object.
threat.objectDestroy=2
threat.construction=5
threat.blueprint=10
# Internal IDs or definition names. The defaults provide human, undead and animal groups.
boss.types=bandit,barbarian,dummy,ghoul,skeleton,wolf,wildboar,firewolf,lion
boss.baseHealth=1000
boss.healthPerLevel=200
boss.initialFollowers=2
# Additional followers per online player. 0.5 means one additional follower for every two players.
boss.followersPerOnlinePlayer=0.0
boss.followerEveryLevels=5
boss.followerHealth=250
# Bosses spawn outside the immediate vicinity of every online player, but always remain in the same sector.
boss.minSpawnDistance=80
boss.spawnChance=10
# Bosses may not spawn in any Rising World area unless this is enabled.
boss.allowSpawnInAreas=false
# -1 is unlimited; 0 disables new boss groups in every sector.
boss.maxBossesPerSector=-1
wallet.enabled=true
# Percentage of the damage dealt by each player; decimals are allowed.
wallet.bountyPercent=50.0

# Optional OZ Discord Connect notifications. Set a channel ID to enable.
discord.channelId=0
